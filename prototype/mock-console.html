<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Affiliate Mock Console</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --line: #d8dee5;
      --text: #1e293b;
      --muted: #62707f;
      --accent: #0f766e;
      --accent-soft: #e2f4f1;
      --blue: #1d4ed8;
      --amber: #b45309;
      --red: #be123c;
      --shadow: 0 1px 2px rgba(15, 23, 42, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button, input, select {
      font: inherit;
      color: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: 100vh;
    }

    .side {
      background: #17212b;
      color: #e7edf3;
      padding: 18px 14px;
      overflow-y: auto;
    }

    .brand {
      margin-bottom: 20px;
      padding: 0 8px;
    }

    .brand strong { display: block; font-size: 16px; }
    .brand span { display: block; margin-top: 3px; color: #97a6b6; font-size: 12px; }

    .nav-group { margin: 16px 0 8px; padding-left: 8px; color: #8296a7; font-size: 12px; }
    .nav {
      display: grid;
      gap: 4px;
    }

    .nav button {
      width: 100%;
      min-height: 34px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #dce5ec;
      text-align: left;
      cursor: pointer;
      padding: 6px 8px;
    }

    .nav button:hover { background: #263543; }
    .nav button[aria-current="true"] { background: var(--accent); color: #fff; }

    .main { display: flex; flex-direction: column; min-width: 0; }

    .top {
      position: sticky;
      top: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(180px, 220px) minmax(150px, 190px) minmax(240px, 1fr) auto auto;
      gap: 8px;
      align-items: end;
      padding: 14px 22px;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .field { display: grid; gap: 3px; }
    .field label { color: var(--muted); font-size: 12px; }

    .control {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      padding: 6px 8px;
    }

    .primary, .secondary {
      min-width: 76px;
      min-height: 34px;
      border-radius: 5px;
      cursor: pointer;
      padding: 6px 12px;
    }

    .primary { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
    .secondary { border: 1px solid var(--line); background: #fff; color: var(--text); }
    .primary:hover { background: #0b5f58; }
    .secondary:hover { background: #f8fafb; }

    .content {
      display: grid;
      gap: 14px;
      padding: 18px 22px 30px;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 8px;
    }

    .metric {
      min-height: 64px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
    }

    .metric span { display: block; color: var(--muted); font-size: 12px; }
    .metric strong { display: block; margin-top: 4px; font-size: 16px; overflow-wrap: anywhere; }

    .panel {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: var(--shadow);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 46px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel-header h1 { margin: 0; font-size: 15px; }
    .panel-header output { color: var(--muted); font-size: 12px; }

    .action {
      display: none;
      grid-template-columns: 110px minmax(320px, 1fr) minmax(120px, 90px) auto;
      gap: 8px;
      align-items: end;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }

    .action.visible { display: grid; }

    .table-wrap { overflow: auto; max-height: 52vh; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #e5eaef; padding: 9px 10px; text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; background: #f8fafb; color: #4c5a68; font-size: 12px; white-space: nowrap; z-index: 1; }
    td { overflow-wrap: anywhere; }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      white-space: nowrap;
    }

    .tag-ok { color: #146c43; background: #e7f6ed; }
    .tag-info { color: var(--blue); background: #edf3ff; }
    .tag-warn { color: var(--amber); background: #fff2dd; }
    .tag-bad { color: var(--red); background: #ffe8ee; }

    .json {
      max-height: 320px;
      overflow: auto;
      margin: 0;
      padding: 12px;
      background: #101820;
      color: #d7e3ee;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre;
    }

    .empty {
      display: none;
      padding: 42px 20px;
      color: var(--muted);
      text-align: center;
    }

    .empty.visible { display: block; }
    .error-panel { display: none; border-color: #f2b8c6; background: #fff7f9; }
    .error-panel.visible { display: block; }
    .error-title { color: var(--red); font-weight: 650; }
    .error-detail { color: #77324a; margin-top: 5px; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .side { position: static; max-height: 280px; }
      .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .top, .status { grid-template-columns: 1fr 1fr; }
      .action { grid-template-columns: 1fr; }
      .primary, .secondary { width: 100%; }
    }

    @media (max-width: 620px) {
      .top, .status { grid-template-columns: 1fr; }
      .content, .top { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <strong>Affiliate Mock</strong>
      <span>Contract Console</span>
    </div>
    <nav class="nav" id="navigation" aria-label="API endpoints"></nav>
  </aside>

  <main class="main">
    <form class="top" id="controls">
      <div class="field">
        <label for="role">角色</label>
        <select class="control" id="role"></select>
      </div>
      <div class="field">
        <label for="scenario">场景</label>
        <select class="control" id="scenario"></select>
      </div>
      <div class="field">
        <label for="baseUrl">API Base</label>
        <input class="control" id="baseUrl" type="url" spellcheck="false">
      </div>
      <button class="primary" type="submit">加载</button>
      <button class="secondary" type="button" id="reset">重置</button>
    </form>

    <section class="content">
      <div class="status">
        <div class="metric"><span>服务</span><strong id="metricService">-</strong></div>
        <div class="metric"><span>场景</span><strong id="metricScenario">-</strong></div>
        <div class="metric"><span>角色</span><strong id="metricRole">-</strong></div>
        <div class="metric"><span>HTTP</span><strong id="metricStatus">-</strong></div>
      </div>

      <section class="panel error-panel" id="errorPanel">
        <div class="panel-header">
          <h1 class="error-title" id="errorCode">Error</h1>
          <output id="errorTrace"></output>
        </div>
        <div class="error-detail" id="errorMessage"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h1 id="panelTitle">Current user</h1>
          <output id="panelPath">/api/v1/me</output>
        </div>
        <form class="action" id="decisionForm">
          <div class="field">
            <label for="decision">决策</label>
            <select class="control" id="decision"></select>
          </div>
          <div class="field">
            <label for="reason">原因</label>
            <input class="control" id="reason" minlength="2" placeholder="审批原因">
          </div>
          <div class="field">
            <label for="targetId">编号</label>
            <input class="control" id="targetId" spellcheck="false">
          </div>
          <button class="primary" type="submit">提交决策</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="empty" id="emptyState">No data</div>
        <pre class="json" id="jsonView"></pre>
      </section>
    </section>
  </main>
</div>

<script>
const roles = ["partner", "operator", "compliance", "finance", "admin"];
const scenarios = ["normal-flow", "no-source", "ib-excluded", "high-risk", "dynamic-hold", "chargeback", "kyc-pending", "empty-state", "api-error"];
const allRoles = new Set(roles);
const operatorRoles = new Set(["operator", "compliance", "finance", "admin"]);
const auditRoles = new Set(["operator", "compliance", "admin"]);
const clientRoles = new Set(["partner", "operator", "compliance", "admin"]);
const commissionRoles = new Set(["partner", "operator", "compliance", "finance", "admin"]);
const settlementRoles = new Set(["operator", "finance", "admin"]);

const endpoints = [
  { id: "me", group: "Session", label: "当前用户", path: "/me", method: "GET", roles: allRoles, sampleId: "" },
  { id: "parameters", group: "Session", label: "参数", path: "/parameters", method: "GET", roles: allRoles, sampleId: "" },
  { id: "partners", group: "Operations", label: "合作者", path: "/partners", method: "GET", roles: operatorRoles, sampleId: "" },
  { id: "partner", group: "Operations", label: "合作者详情", path: "/partners/{id}", method: "GET", roles: operatorRoles, sampleId: "P-001" },
  { id: "audits", group: "Operations", label: "合作者审核", path: "/partner-audits", method: "GET", roles: auditRoles, sampleId: "" },
  { id: "auditDecision", group: "Operations", label: "审核决策", path: "/partner-audits/{id}/decision", method: "POST", roles: auditRoles, sampleId: "pa-001", decisions: [["approve", "approve"], ["reject", "reject"], ["materials-required", "materials-required"]], reasonRequired: ["reject", "materials-required"] },
  { id: "clients", group: "Data", label: "客户", path: "/clients", method: "GET", roles: clientRoles, sampleId: "" },
  { id: "client", group: "Data", label: "客户详情", path: "/clients/{id}", method: "GET", roles: clientRoles, sampleId: "C-001" },
  { id: "commissions", group: "Finance", label: "佣金", path: "/commissions", method: "GET", roles: commissionRoles, sampleId: "" },
  { id: "commissionSummary", group: "Finance", label: "佣金汇总", path: "/commissions/summary", method: "GET", roles: commissionRoles, sampleId: "" },
  { id: "settlements", group: "Finance", label: "结算", path: "/settlements", method: "GET", roles: settlementRoles, sampleId: "" },
  { id: "settlementDecision", group: "Finance", label: "结算决策", path: "/settlements/{id}/decision", method: "POST", roles: settlementRoles, sampleId: "st-001", decisions: [["approve", "approve"], ["reject", "reject"], ["freeze", "freeze"]], reasonRequired: ["reject", "freeze"] },
  { id: "riskEvents", group: "Risk", label: "风控事件", path: "/risk-events", method: "GET", roles: auditRoles, sampleId: "" },
  { id: "riskDecision", group: "Risk", label: "风控决策", path: "/risk-events/{id}/decision", method: "POST", roles: auditRoles, sampleId: "re-001", decisions: [["resolve", "resolve"], ["escalate", "escalate"]], reasonRequired: ["escalate"] }
];

const state = {
  endpoint: endpoints[0],
  role: localStorage.getItem("mock.role") || "operator",
  scenario: localStorage.getItem("mock.scenario") || "normal-flow",
  baseUrl: localStorage.getItem("mock.baseUrl") || window.location.origin
};

const navigation = document.getElementById("navigation");
const roleSelect = document.getElementById("role");
const scenarioSelect = document.getElementById("scenario");
const baseUrlInput = document.getElementById("baseUrl");
const decisionForm = document.getElementById("decisionForm");
const decisionSelect = document.getElementById("decision");
const reasonInput = document.getElementById("reason");
const targetInput = document.getElementById("targetId");
const tableHead = document.getElementById("tableHead");
const tableBody = document.getElementById("tableBody");
const jsonView = document.getElementById("jsonView");
const emptyState = document.getElementById("emptyState");
const errorPanel = document.getElementById("errorPanel");

function fillSelect(select, values, value) {
  select.innerHTML = "";
  for (const item of values) {
    const option = document.createElement("option");
    option.value = item;
    option.textContent = item;
    select.append(option);
  }
  select.value = value;
}

function renderNavigation() {
  navigation.innerHTML = "";
  let currentGroup = "";
  for (const endpoint of endpoints) {
    if (!endpoint.roles.has(state.role)) continue;
    if (endpoint.group !== currentGroup) {
      currentGroup = endpoint.group;
      const title = document.createElement("div");
      title.className = "nav-group";
      title.textContent = currentGroup;
      navigation.append(title);
    }
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = endpoint.label;
    button.setAttribute("aria-current", String(endpoint === state.endpoint));
    button.addEventListener("click", () => {
      state.endpoint = endpoint;
      targetInput.value = endpoint.sampleId || "";
      renderNavigation();
      renderEndpoint();
      loadData();
    });
    navigation.append(button);
  }
}

function endpointPath() {
  const id = targetInput.value.trim();
  if (!state.endpoint.path.includes("{id}")) return state.endpoint.path;
  if (!id) throw new Error("Target ID is required.");
  return state.endpoint.path.replace("{id}", encodeURIComponent(id));
}

function apiUrl(path) {
  const base = baseUrlInput.value.replace(/\/+$/, "");
  const url = new URL(`/api/v1${path}`, base);
  url.searchParams.set("scenario", state.scenario);
  return url;
}

function setStatus(httpStatus, payload) {
  document.getElementById("metricService").textContent = payload?.service || "affiliate-mock";
  document.getElementById("metricScenario").textContent = state.scenario;
  document.getElementById("metricRole").textContent = state.role;
  document.getElementById("metricStatus").textContent = String(httpStatus);
}

function showError(error) {
  errorPanel.classList.add("visible");
  document.getElementById("errorCode").textContent = error.code || "REQUEST_FAILED";
  document.getElementById("errorMessage").textContent = error.message || "Request failed.";
  document.getElementById("errorTrace").textContent = error.traceId ? `trace ${error.traceId}` : "";
}

function clearError() {
  errorPanel.classList.remove("visible");
}

function valueHtml(value) {
  if (value === null || value === undefined) return "<span class=\"tag tag-warn\">null</span>";
  if (value === true) return "<span class=\"tag tag-ok\">true</span>";
  if (value === false) return "<span class=\"tag tag-bad\">false</span>";
  if (typeof value === "number") return String(value);
  if (typeof value !== "string") return JSON.stringify(value);
  if (/^(approved|active|paid|resolved|ok|attributed|qualified|NONE|daily)$/i.test(value)) return `<span class="tag tag-ok">${escapeHtml(value)}</span>`;
  if (/^(pending|holding|trading|materials-required|investigating)$/i.test(value)) return `<span class=\"tag tag-warn\">${escapeHtml(value)}</span>`;
  if (/^(rejected|reversed|banned|frozen|no-source|ib-excluded)$/i.test(value)) return `<span class=\"tag tag-bad\">${escapeHtml(value)}</span>`;
  if (/^(R[0-4]|escalated|suspended)$/i.test(value)) return `<span class="tag tag-info">${escapeHtml(value)}</span>`;
  return escapeHtml(value);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
}

function renderRows(rows) {
  tableHead.innerHTML = "";
  tableBody.innerHTML = "";
  emptyState.classList.toggle("visible", rows.length === 0);
  if (rows.length === 0) return;
  const headers = [...new Set(rows.flatMap((row) => Object.keys(row)))];
  const headRow = document.createElement("tr");
  for (const header of headers) {
    const cell = document.createElement("th");
    cell.textContent = header;
    headRow.append(cell);
  }
  tableHead.append(headRow);

  for (const row of rows) {
    const tr = document.createElement("tr");
    for (const header of headers) {
      const cell = document.createElement("td");
      cell.innerHTML = valueHtml(row[header]);
      tr.append(cell);
    }
    tableBody.append(tr);
  }
}

function renderPayload(payload) {
  const data = payload?.data;
  if (Array.isArray(data)) renderRows(data);
  else if (data && typeof data === "object") renderRows([data]);
  else renderRows([]);
  jsonView.textContent = JSON.stringify(payload, null, 2);
}

async function request(path, options = {}) {
  const response = await fetch(apiUrl(path), {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "X-Mock-Role": state.role,
      ...options.headers
    }
  });
  let payload = null;
  try { payload = await response.json(); } catch { payload = null; }
  setStatus(response.status, payload);
  if (!response.ok) throw payload?.error || { code: `HTTP_${response.status}`, message: response.statusText };
  return payload;
}

async function loadData() {
  clearError();
  try {
    const payload = await request(endpointPath());
    renderPayload(payload);
  } catch (error) {
    renderRows([]);
    jsonView.textContent = JSON.stringify(error, null, 2);
    showError(error);
  }
}

function renderEndpoint() {
  document.getElementById("panelTitle").textContent = state.endpoint.label;
  document.getElementById("panelPath").textContent = `/api/v1${state.endpoint.path}`;
  decisionForm.classList.toggle("visible", Boolean(state.endpoint.decisions));
  decisionSelect.innerHTML = "";
  reasonInput.required = false;
  if (state.endpoint.decisions) {
    for (const [value, label] of state.endpoint.decisions) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      decisionSelect.append(option);
    }
    targetInput.value = state.endpoint.sampleId || "";
    updateReasonRequirement();
  }
}

function updateReasonRequirement() {
  reasonInput.required = state.endpoint.reasonRequired?.includes(decisionSelect.value) || false;
}

function selectFirstAllowedEndpoint() {
  if (state.endpoint.roles.has(state.role)) return;
  state.endpoint = endpoints.find((endpoint) => endpoint.roles.has(state.role)) || endpoints[0];
  targetInput.value = state.endpoint.sampleId || "";
}

document.getElementById("controls").addEventListener("submit", async (event) => {
  event.preventDefault();
  state.role = roleSelect.value;
  state.scenario = scenarioSelect.value;
  state.baseUrl = baseUrlInput.value;
  localStorage.setItem("mock.role", state.role);
  localStorage.setItem("mock.scenario", state.scenario);
  localStorage.setItem("mock.baseUrl", state.baseUrl);
  selectFirstAllowedEndpoint();
  renderNavigation();
  renderEndpoint();
  await loadData();
});

roleSelect.addEventListener("change", () => {
  state.role = roleSelect.value;
  selectFirstAllowedEndpoint();
  renderNavigation();
  renderEndpoint();
  loadData();
});

scenarioSelect.addEventListener("change", () => {
  state.scenario = scenarioSelect.value;
  loadData();
});

decisionSelect.addEventListener("change", updateReasonRequirement);

decisionForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  clearError();
  try {
    const path = endpointPath();
    const payload = await request(path, {
      method: "POST",
      headers: { "Idempotency-Key": crypto.randomUUID() },
      body: JSON.stringify({
        decision: decisionSelect.value,
        reason: reasonInput.value.trim()
      })
    });
    renderPayload(payload);
  } catch (error) {
    renderRows([]);
    jsonView.textContent = JSON.stringify(error, null, 2);
    showError(error);
  }
});

document.getElementById("reset").addEventListener("click", async () => {
  clearError();
  try {
    const base = baseUrlInput.value.replace(/\/+$/, "");
    const response = await fetch(`${base}/__reset`, { method: "POST" });
    const payload = await response.json();
    setStatus(response.status, payload);
    await loadData();
  } catch (error) {
    showError({ code: "RESET_FAILED", message: String(error) });
  }
});

fillSelect(roleSelect, roles, state.role);
fillSelect(scenarioSelect, scenarios, state.scenario);
baseUrlInput.value = state.baseUrl;
targetInput.value = state.endpoint.sampleId || "";
renderNavigation();
renderEndpoint();
loadData();
</script>
</body>
</html>
