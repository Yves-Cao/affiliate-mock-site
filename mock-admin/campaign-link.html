<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>推广链接 · Affiliate CPA</title>
  <link rel="icon" type="image/svg+xml" href="./assets/affiliate-icon.svg">
  <link rel="alternate icon" type="image/png" sizes="32x32" href="./assets/affiliate-icon-32.png">
  <link rel="apple-touch-icon" href="./assets/affiliate-icon-180.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./campaign-link.css">
  <script defer src="./data.js"></script>

<body class="campaign-access-page">
  <header class="campaign-access-header">
    <div class="brand">
      <img class="brand-mark" src="./assets/affiliate-icon.svg" alt="A" width="28" height="28">
      <span class="brand-text"><strong>Affiliate CPA</strong></span>

  <main class="campaign-access-main" id="main">
    <section class="campaign-access-content" aria-labelledby="campaign-access-title" aria-live="polite">
      <p class="campaign-access-status" id="campaign-access-status"></p>
      <h1 id="campaign-access-title"></h1>
      <p class="campaign-access-description" id="campaign-access-description"></p>
      <p class="campaign-access-name" id="campaign-access-name" hidden></p>
      <button class="button primary" id="campaign-access-continue" type="button" hidden></button>
    </section>
  </main>
