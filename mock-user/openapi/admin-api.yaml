openapi: 3.0.3
info:
  title: Affiliate Admin API
  version: 0.5.0
  description: >
    Affiliate independent operations-admin API contract. The frontend must call
    only this API. CRM, payment, finance, tax, and fraud-db integrations are
    encapsulated by the Affiliate backend and are not exposed directly.
servers:
  - url: http://127.0.0.1:4020/admin/api/v1
    description: Local mock server
  - url: https://api.affiliate.internal/admin/api/v1
    description: Placeholder for the future internal production gateway
security:
  - bearerAuth: []
tags:
  - name: session
  - name: dashboard
  - name: partners
  - name: clients
  - name: commissions
  - name: withdrawals
  - name: integration-tasks
paths:
  /session:
    get:
      tags: [session]
      operationId: getSession
      summary: Get current SSO session and mapped Affiliate role
      parameters:
        - $ref: "#/components/parameters/MockRole"
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: Get role-specific dashboard metrics and todos
      parameters:
        - $ref: "#/components/parameters/MockRole"
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Dashboard"
        "403":
          $ref: "#/components/responses/Forbidden"
  /partners:
    get:
      tags: [partners]
      operationId: listPartners
      summary: List partners
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/PartnerStatus"}
        - name: risk_band
          in: query
          schema: {$ref: "#/components/schemas/RiskBand"}
        - name: country_code
          in: query
          schema: {type: string, minLength: 2, maxLength: 2}
      responses:
        "200":
          description: Partner page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: {$ref: "#/components/schemas/Partner"}
                          page: {type: integer, minimum: 1}
                          page_size: {type: integer, minimum: 1, maximum: 100}
                          total: {type: integer, minimum: 0}
                          pages: {type: integer, minimum: 1}
  /partners/{partner_id}:
    get:
      tags: [partners]
      operationId: getPartner
      summary: Get partner detail
      parameters:
        - $ref: "#/components/parameters/PartnerId"
      responses:
        "200":
          description: Partner detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/PartnerDetail"}
        "404":
          $ref: "#/components/responses/NotFound"
  /partners/{partner_id}/actions/freeze:
    post:
      tags: [partners]
      operationId: freezePartner
      summary: Freeze partner
      x-required-roles: [system_admin, risk]
      parameters:
        - $ref: "#/components/parameters/PartnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonActionRequest"}
      responses:
        "200":
          $ref: "#/components/responses/ActionSuccess"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /partners/{partner_id}/actions/restore:
    post:
      tags: [partners]
      operationId: restorePartner
      summary: Restore partner
      x-required-roles: [system_admin, risk]
      parameters:
        - $ref: "#/components/parameters/PartnerId"
      responses:
        "200":
          $ref: "#/components/responses/ActionSuccess"
  /partners/{partner_id}/actions/terminate:
    post:
      tags: [partners]
      operationId: terminatePartner
      summary: Terminate partner cooperation
      x-required-roles: [system_admin, risk, compliance]
      parameters:
        - $ref: "#/components/parameters/PartnerId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonActionRequest"}
      responses:
        "200":
          $ref: "#/components/responses/ActionSuccess"
  /clients:
    get:
      tags: [clients]
      operationId: listClients
      summary: List attributed clients
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema: {type: string}
        - name: conversion_stage
          in: query
          schema: {$ref: "#/components/schemas/ConversionStage"}
        - name: partner_id
          in: query
          schema: {type: string}
        - name: risk_band
          in: query
          schema: {$ref: "#/components/schemas/RiskBand"}
      responses:
        "200":
          description: Client page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: {$ref: "#/components/schemas/Client"}
                          page: {type: integer}
                          page_size: {type: integer}
                          total: {type: integer}
                          pages: {type: integer}
  /clients/{client_id}:
    get:
      tags: [clients]
      operationId: getClient
      summary: Get client detail
      parameters:
        - $ref: "#/components/parameters/ClientId"
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/ClientDetail"}
        "404":
          $ref: "#/components/responses/NotFound"
  /commissions:
    get:
      tags: [commissions]
      operationId: listCommissions
      summary: List commission cases
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/CommissionStatus"}
        - name: partner_id
          in: query
          schema: {type: string}
        - name: client_id
          in: query
          schema: {type: string}
        - name: case_type
          in: query
          schema: {$ref: "#/components/schemas/CommissionCaseType"}
      responses:
        "200":
          description: Commission page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: {$ref: "#/components/schemas/Commission"}
                          page: {type: integer}
                          page_size: {type: integer}
                          total: {type: integer}
                          pages: {type: integer}
  /commissions/{commission_id}:
    get:
      tags: [commissions]
      operationId: getCommission
      summary: Get commission calculation and lifecycle detail
      parameters:
        - $ref: "#/components/parameters/CommissionId"
      responses:
        "200":
          description: Commission detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/CommissionDetail"}
        "404":
          $ref: "#/components/responses/NotFound"
  /commissions/{commission_id}/actions/confirm:
    post:
      tags: [commissions]
      operationId: confirmCommission
      summary: Manually confirm a commission case
      x-required-roles: [system_admin, risk, finance]
      parameters:
        - $ref: "#/components/parameters/CommissionId"
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonActionRequest"}
      responses:
        "200":
          $ref: "#/components/responses/ActionSuccess"
  /commissions/{commission_id}/actions/reverse:
    post:
      tags: [commissions]
      operationId: reverseCommission
      summary: Reverse a commission case
      x-required-roles: [system_admin, risk, finance]
      parameters:
        - $ref: "#/components/parameters/CommissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonActionRequest"}
      responses:
        "200":
          $ref: "#/components/responses/ActionSuccess"
  /withdrawals:
    get:
      tags: [withdrawals]
      operationId: listWithdrawals
      summary: List withdrawal orders
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/WithdrawalStatus"}
        - name: partner_id
          in: query
          schema: {type: string}
        - name: method
          in: query
          schema: {type: string, enum: [wire, wallet]}
      responses:
        "200":
          description: Withdrawal page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: {$ref: "#/components/schemas/Withdrawal"}
                          page: {type: integer}
                          page_size: {type: integer}
                          total: {type: integer}
                          pages: {type: integer}
  /withdrawals/{withdrawal_id}:
    get:
      tags: [withdrawals]
      operationId: getWithdrawal
      summary: Get withdrawal detail
      parameters:
        - $ref: "#/components/parameters/WithdrawalId"
      responses:
        "200":
          description: Withdrawal detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/WithdrawalDetail"}
        "404":
          $ref: "#/components/responses/NotFound"
  /withdrawals/{withdrawal_id}/actions/approve:
    post:
      tags: [withdrawals]
      operationId: approveWithdrawal
      summary: Approve withdrawal
      x-required-roles: [system_admin, finance]
      parameters:
        - $ref: "#/components/parameters/WithdrawalId"
      responses:
        "200":
          $ref: "#/components/responses/ActionSuccess"
  /withdrawals/{withdrawal_id}/actions/reject:
    post:
      tags: [withdrawals]
      operationId: rejectWithdrawal
      summary: Reject withdrawal
      x-required-roles: [system_admin, finance]
      parameters:
        - $ref: "#/components/parameters/WithdrawalId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonActionRequest"}
      responses:
        "200":
          $ref: "#/components/responses/ActionSuccess"
  /withdrawals/{withdrawal_id}/actions/retry-payment:
    post:
      tags: [withdrawals]
      operationId: retryWithdrawalPayment
      summary: Retry the wrapped external payment task
      x-required-roles: [system_admin, finance]
      parameters:
        - $ref: "#/components/parameters/WithdrawalId"
      responses:
        "200":
          $ref: "#/components/responses/ActionSuccess"
  /integration-tasks:
    get:
      tags: [integration-tasks]
      operationId: listIntegrationTasks
      summary: List wrapped external-system tasks
      x-required-roles: [system_admin, audit]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {$ref: "#/components/schemas/IntegrationTaskStatus"}
        - name: external_system
          in: query
          schema: {type: string, enum: [CRM, PAYMENT, FINANCE, TAX, FRAUD_DB]}
      responses:
        "200":
          description: Integration task page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: {$ref: "#/components/schemas/IntegrationTask"}
                          page: {type: integer}
                          page_size: {type: integer}
                          total: {type: integer}
                          pages: {type: integer}
        "403":
          $ref: "#/components/responses/Forbidden"
  /integration-tasks/{task_id}:
    get:
      tags: [integration-tasks]
      operationId: getIntegrationTask
      summary: Get external-system task detail
      x-required-roles: [system_admin, audit]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Integration task detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/IntegrationTask"}
        "404":
          $ref: "#/components/responses/NotFound"
  /integration-tasks/{task_id}/actions/retry:
    post:
      tags: [integration-tasks]
      operationId: retryIntegrationTask
      summary: Retry an external-system task
      x-required-roles: [system_admin]
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          $ref: "#/components/responses/ActionSuccess"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: SSO access token
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    MockRole:
      name: X-Mock-Role
      in: header
      description: Local mock only. Production role must come from the SSO gateway.
      schema: {$ref: "#/components/schemas/AdminRole"}
    PartnerId:
      name: partner_id
      in: path
      required: true
      schema: {type: string, pattern: "^partner-[0-9]+$"}
    ClientId:
      name: client_id
      in: path
      required: true
      schema: {type: string, pattern: "^client-[0-9]+$"}
    CommissionId:
      name: commission_id
      in: path
      required: true
      schema: {type: string, pattern: "^comm-[0-9]+$"}
    WithdrawalId:
      name: withdrawal_id
      in: path
      required: true
      schema: {type: string, pattern: "^wd-[0-9]+$"}
    TaskId:
      name: task_id
      in: path
      required: true
      schema: {type: string, pattern: "^int-[0-9]+$"}
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    NotFound:
      description: Not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    ActionSuccess:
      description: Action accepted and audited
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data: {$ref: "#/components/schemas/ActionResponse"}
  schemas:
    AdminRole:
      type: string
      enum: [system_admin, operations, risk, finance, compliance, audit]
    PartnerStatus:
      type: string
      enum: [pending, active, restricted, frozen, terminated]
    RiskBand:
      type: string
      enum: [R0, R1, R2, R3, R4]
    ConversionStage:
      type: string
      enum: [clicked, registered, kyc_passed, ftd, valid_ftd, quality_service, voided]
    CommissionStatus:
      type: string
      enum: [pending_generation, holding, manual_review, settled, paid, reversed, rejected]
    CommissionCaseType:
      type: string
      enum: [qftd_batch, quality_service]
    WithdrawalStatus:
      type: string
      enum: [draft, pending_review, approved, paying, paid, failed, timeout, rejected]
    IntegrationTaskStatus:
      type: string
      enum: [pending, processing, success, failed, retrying, cancelled]
    Money:
      type: object
      required: [currency, amount_minor]
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: USD
        amount_minor:
          type: string
          pattern: "^-?[0-9]+$"
          description: Smallest currency unit as a string to avoid floating-point errors.
          example: "15000"
    SuccessEnvelope:
      type: object
      required: [code, message, data, trace_id]
      properties:
        code: {type: string, example: OK}
        message: {type: string, example: success}
        data: {nullable: true}
        trace_id: {type: string, example: trace-000001}
    ErrorEnvelope:
      type: object
      required: [code, message, trace_id]
      properties:
        code: {type: string, example: FORBIDDEN}
        message: {type: string}
        trace_id: {type: string}
        details:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              issue: {type: string}
    ReasonActionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
        remark: {type: string, maxLength: 500}
    ActionResponse:
      type: object
      required: [object_id, action, status, audit_recorded]
      properties:
        object_id: {type: string}
        action: {type: string}
        status: {type: string}
        audit_recorded: {type: boolean}
    Session:
      type: object
      properties:
        user:
          type: object
          properties:
            sso_subject: {type: string}
            display_name: {type: string}
            email_masked: {type: string}
        role:
          type: object
          properties:
            id: {$ref: "#/components/schemas/AdminRole"}
            name: {type: string}
        available_roles:
          type: array
          items:
            type: object
            properties:
              id: {$ref: "#/components/schemas/AdminRole"}
              name: {type: string}
        environment: {type: string}
        api_version: {type: string}
    Dashboard:
      type: object
      properties:
        metrics:
          type: array
          items:
            type: object
            properties:
              key: {type: string}
              label: {type: string}
              value: {}
        todos:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              type: {type: string}
              title: {type: string}
              count: {type: integer}
              route: {type: string}
              roles:
                type: array
                items: {$ref: "#/components/schemas/AdminRole"}
    Partner:
      type: object
      properties:
        partner_id: {type: string}
        partner_code: {type: string}
        display_name: {type: string}
        email_masked: {type: string}
        phone_masked: {type: string}
        country_code: {type: string}
        country_name: {type: string}
        status: {$ref: "#/components/schemas/PartnerStatus"}
        kyb_status: {type: string, enum: [pending, approved, rejected]}
        risk_band: {$ref: "#/components/schemas/RiskBand"}
        agreement_version: {type: string}
        available_balance: {$ref: "#/components/schemas/Money"}
        guarantee_balance: {$ref: "#/components/schemas/Money"}
        commission_total: {$ref: "#/components/schemas/Money"}
        client_count: {type: integer}
        valid_ftd_count: {type: integer}
        quality_count: {type: integer}
        account_manager: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PartnerDetail:
      allOf:
        - $ref: "#/components/schemas/Partner"
        - type: object
          properties:
            tax_status: {type: string}
            payout_method: {type: string}
            receiving_account_masked: {type: string}
            external_refs: {type: object}
            clients:
              type: array
              items: {$ref: "#/components/schemas/Client"}
            commissions:
              type: array
              items: {$ref: "#/components/schemas/Commission"}
            withdrawals:
              type: array
              items: {$ref: "#/components/schemas/Withdrawal"}
    Client:
      type: object
      properties:
        client_id: {type: string}
        partner_id: {type: string}
        email_masked: {type: string}
        phone_masked: {type: string}
        country_code: {type: string}
        country_name: {type: string}
        conversion_stage: {$ref: "#/components/schemas/ConversionStage"}
        kyc_status: {type: string, enum: [pending, passed, rejected]}
        tier: {type: string, enum: [pending, L1, L2, L3, L4]}
        attribution_status: {type: string, enum: [attributed, conflict, invalid]}
        registration_platform: {type: string}
        traffic_campaign: {type: string}
        click_id: {type: string}
        registered_at: {type: string, format: date-time, nullable: true}
        ftd_at: {type: string, format: date-time, nullable: true}
        valid_ftd_at: {type: string, format: date-time, nullable: true}
        quality_service_at: {type: string, format: date-time, nullable: true}
        net_deposit: {$ref: "#/components/schemas/Money"}
        trade_lots: {type: number}
        active_trade_days: {type: integer}
        risk_band: {$ref: "#/components/schemas/RiskBand"}
        commission_ids:
          type: array
          items: {type: string}
    ClientDetail:
      allOf:
        - $ref: "#/components/schemas/Client"
        - type: object
          properties:
            partner: {$ref: "#/components/schemas/Partner"}
            commissions:
              type: array
              items: {$ref: "#/components/schemas/Commission"}
    Commission:
      type: object
      properties:
        commission_id: {type: string}
        partner_id: {type: string}
        client_id: {type: string}
        case_type: {$ref: "#/components/schemas/CommissionCaseType"}
        status: {$ref: "#/components/schemas/CommissionStatus"}
        currency: {type: string}
        gross_amount_minor: {type: string}
        tax_amount_minor: {type: string}
        guarantee_amount_minor: {type: string}
        net_amount_minor: {type: string}
        config_version: {type: string}
        price_version: {type: string}
        hold_started_at: {type: string, format: date-time, nullable: true}
        hold_release_at: {type: string, format: date-time, nullable: true}
        hold_days: {type: integer}
        manual_review_required: {type: boolean}
        settlement_id: {type: string, nullable: true}
        reversal_reason: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CommissionDetail:
      allOf:
        - $ref: "#/components/schemas/Commission"
        - type: object
          properties:
            partner: {$ref: "#/components/schemas/Partner"}
            client: {$ref: "#/components/schemas/Client"}
            calculation:
              type: array
              items:
                type: object
                properties:
                  step: {type: string}
                  currency: {type: string}
                  amount_minor: {type: string}
    Withdrawal:
      type: object
      properties:
        withdrawal_id: {type: string}
        partner_id: {type: string}
        amount: {$ref: "#/components/schemas/Money"}
        method: {type: string, enum: [wire, wallet]}
        status: {$ref: "#/components/schemas/WithdrawalStatus"}
        fee: {$ref: "#/components/schemas/Money"}
        received_amount: {$ref: "#/components/schemas/Money"}
        kyb_status: {type: string}
        requested_at: {type: string, format: date-time}
        reviewed_by: {type: string, nullable: true}
        reviewed_at: {type: string, format: date-time, nullable: true}
        paid_at: {type: string, format: date-time, nullable: true}
        failure_reason: {type: string, nullable: true}
        integration_task_id: {type: string, nullable: true}
    WithdrawalDetail:
      allOf:
        - $ref: "#/components/schemas/Withdrawal"
        - type: object
          properties:
            partner: {$ref: "#/components/schemas/Partner"}
            integration_task: {$ref: "#/components/schemas/IntegrationTask"}
            allocations:
              type: array
              items:
                type: object
                properties:
                  settlement_id: {type: string}
                  amount_minor: {type: string}
    IntegrationTask:
      type: object
      properties:
        task_id: {type: string}
        business_type: {type: string}
        business_ref_id: {type: string}
        external_system: {type: string}
        external_ref_id: {type: string, nullable: true}
        status: {$ref: "#/components/schemas/IntegrationTaskStatus"}
        retry_count: {type: integer}
        last_error: {type: string, nullable: true}
        operator_id: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
