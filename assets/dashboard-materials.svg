<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Promotional materials: banner, video and landing page">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2176"/>
      <stop offset="1" stop-color="#1a5bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7aa2ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7aa2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d1deff"/>
      <stop offset="1" stop-color="#7aa2ff"/>
    </linearGradient>
    <linearGradient id="art2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1a5bff"/>
      <stop offset="1" stop-color="#487cff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#00104a" flood-opacity=".38"/>
    </filter>
    <clipPath id="c1"><rect x="64" y="70" width="270" height="168" rx="14"/></clipPath>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#glow)"/>
  <circle cx="548" cy="64" r="150" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <circle cx="548" cy="64" r="230" fill="none" stroke="#fff" stroke-opacity=".05"/>
  <circle cx="70" cy="380" r="120" fill="none" stroke="#fff" stroke-opacity=".06"/>

  <!-- Landing page (back, right) -->
  <g transform="rotate(5 470 190)" filter="url(#sh)">
    <rect x="330" y="86" width="226" height="190" rx="14" fill="#fff"/>
    <path d="M330 100a14 14 0 0 1 14-14h198a14 14 0 0 1 14 14v22H330z" fill="#eef2f6"/>
    <circle cx="348" cy="104" r="3.5" fill="#cdd5df"/><circle cx="361" cy="104" r="3.5" fill="#cdd5df"/><circle cx="374" cy="104" r="3.5" fill="#cdd5df"/>
    <rect x="392" y="98" width="140" height="12" rx="6" fill="#fff"/>
    <rect x="350" y="138" width="110" height="12" rx="6" fill="#0a0d12" fill-opacity=".85"/>
    <rect x="350" y="158" width="150" height="8" rx="4" fill="#cdd5df"/>
    <rect x="350" y="172" width="126" height="8" rx="4" fill="#cdd5df"/>
    <rect x="350" y="196" width="72" height="26" rx="8" fill="#1a5bff"/>
    <rect x="350" y="236" width="186" height="26" rx="8" fill="#f3f4f6"/>
    <rect x="360" y="245" width="60" height="8" rx="4" fill="#a4a7ae"/>
  </g>

  <!-- Banner (front, left) -->
  <g transform="rotate(-4 200 154)" filter="url(#sh)">
    <rect x="64" y="70" width="270" height="168" rx="14" fill="#fff"/>
    <g clip-path="url(#c1)">
      <rect x="64" y="70" width="270" height="108" fill="url(#art)"/>
      <path d="M64 178 L120 132 L158 156 L214 104 L262 138 L334 90 V178 Z" fill="#fff" fill-opacity=".55"/>
      <path d="M64 178 L112 150 L152 168 L206 126 L254 158 L334 118 V178 Z" fill="#1a5bff" fill-opacity=".85"/>
    </g>
    <rect x="82" y="194" width="120" height="12" rx="6" fill="#0a0d12" fill-opacity=".85"/>
    <rect x="82" y="214" width="170" height="8" rx="4" fill="#cdd5df"/>
    <rect x="266" y="194" width="50" height="28" rx="8" fill="#1a5bff"/>
  </g>

  <!-- Video (front, bottom) -->
  <g transform="rotate(3 250 312)" filter="url(#sh)">
    <rect x="150" y="248" width="200" height="104" rx="14" fill="#fff"/>
    <rect x="164" y="262" width="108" height="76" rx="10" fill="url(#art2)"/>
    <circle cx="218" cy="300" r="16" fill="#fff" fill-opacity=".95"/>
    <path d="M213 292 L228 300 L213 308 Z" fill="#1a5bff"/>
    <rect x="286" y="266" width="50" height="10" rx="5" fill="#0a0d12" fill-opacity=".85"/>
    <rect x="286" y="284" width="42" height="7" rx="3.5" fill="#cdd5df"/>
    <rect x="286" y="298" width="34" height="7" rx="3.5" fill="#cdd5df"/>
    <rect x="164" y="344" width="0" height="0"/>
  </g>

  <!-- Trend chip -->
  <g filter="url(#sh)">
    <rect x="452" y="262" width="120" height="70" rx="14" fill="#fff"/>
    <rect x="468" y="276" width="44" height="8" rx="4" fill="#cdd5df"/>
    <path d="M468 318 L488 304 L504 310 L528 292 L552 298" fill="none" stroke="#17b26a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="552" cy="298" r="5" fill="#17b26a"/>
  </g>

  <!-- GIF tag -->
  <g filter="url(#sh)" transform="rotate(-6 96 292)">
    <rect x="62" y="272" width="68" height="40" rx="12" fill="#fff"/>
    <rect x="76" y="284" width="14" height="16" rx="3" fill="#1a5bff"/>
    <rect x="95" y="284" width="8" height="16" rx="3" fill="#1a5bff" fill-opacity=".55"/>
    <rect x="108" y="284" width="8" height="16" rx="3" fill="#1a5bff" fill-opacity=".3"/>
  </g>
</svg>
