<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Affiliate user-side mock pages with synthetic data only.">
  <title>Affiliate 用户端 Mock</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <section id="login-view" class="login-view" aria-label="Demo login">
    <form id="login-form" class="login-panel" novalidate>
      <div>
        <p class="eyebrow">Affiliate</p>
        <h1>用户端 Mock</h1>
        <p class="login-note">任意非空账号密码仅用于演示门槛，不是安全认证。</p>
      </div>
      <label>
        <span>账号</span>
        <input name="username" type="text" autocomplete="username" required>
      </label>
      <label>
        <span>密码</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="form-error" hidden>请输入账号和密码。</p>
      <button class="button primary wide" type="submit">登录</button>
    </form>
  </section>

  <div id="app-view" class="app-view hidden">
    <aside id="sidebar" class="sidebar" aria-label="用户端导航">
      <div class="brand">
        <span class="brand-mark">A</span>
        <span class="brand-text">
          <strong>Affiliate</strong>
          <small>Partner Console</small>
        </span>
      </div>
      <nav id="nav" class="nav"></nav>
      <button id="profile-entry" class="nav-item profile-entry" type="button" data-route="apply">
        <span class="nav-icon">·</span>
        <span class="nav-label">资料完善</span>
      </button>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <button id="sidebar-toggle" class="icon-button" type="button" aria-label="切换侧栏">≡</button>
          <div>
            <p id="breadcrumb" class="breadcrumb">数据总览 › 仪表盘</p>
            <p id="topbar-caption" class="topbar-caption">Affiliate 用户端演示 · 虚构数据</p>
          </div>
        </div>
        <div class="topbar-tools">
          <a class="wallet" href="#/pay">
            <span>可提现</span>
            <strong>$12,480.50</strong>
          </a>
          <button class="icon-button" type="button" aria-label="帮助中心">?</button>
          <button id="language-toggle" class="icon-button" type="button" aria-label="切换语言">中/EN</button>
          <button class="icon-button notice" type="button" aria-label="通知">!<span></span></button>
          <span class="avatar" aria-hidden="true">M</span>
        </div>
      </header>

      <div id="kyc-banner" class="kyc-banner">
        <span>您的账户资料未完善，部分功能可能受限。</span>
        <div>
          <button id="dismiss-kyc" class="button secondary small" type="button">知道了</button>
          <button class="button primary small" type="button" data-route="apply">去完善</button>
        </div>
      </div>

      <main id="main" class="main" tabindex="-1"></main>

      <footer class="footer">
        <span>Affiliate User Mock</span>
        <span>Synthetic data only</span>
      </footer>
    </div>
  </div>

  <div id="modal-root" class="modal-layer hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="./data.js"></script>
  <script src="./pages.js"></script>
  <script src="./app.js"></script>
</body>
</html>
